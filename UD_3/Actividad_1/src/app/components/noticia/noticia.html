<div class="card">
    <img class="card-img-top" [src]="noticia.imagen" alt="Foto" />
    <div class="card-body">
        <h4 class="card-title">{{noticia.titulo}}</h4>
        <p class="card-text">{{noticia.cuerpo}}</p>
        <p class="card-text text-secondary">Fecha : {{noticia.fechaPublicacion}}</p>
    </div>
</div>
